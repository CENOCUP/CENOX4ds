<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA DATABASE - Tactical Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0a0a0b; --card: #141417; --neon: #00ff87; --danger: #ff4444; --text: #f0f0f0; --dim: #a0a0a0; --blue: #00d4ff; --gold: #ffd700; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1300px; }
        header { text-align: center; margin-bottom: 20px; cursor: pointer; padding: 20px; border-radius: 15px; border-bottom: 1px solid #333; }
        h1 span { color: var(--neon); }

        #adminPanel { display: none; background: #1a1a1e; padding: 20px; border-radius: 15px; margin-bottom: 25px; border: 1px solid var(--neon); }
        .btn { padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 700; border: none; text-transform: uppercase; font-size: 0.75rem; flex: 1; }
        .btn-green { background: var(--neon); color: #000; }
        
        /* Grid de Gráficos */
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .chart-box { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #222; height: 350px; }
        .full-chart { grid-column: span 2; height: 400px; }

        .table-wrap { background: var(--card); border-radius: 20px; padding: 20px; overflow-x: auto; border: 1px solid #222; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { text-align: center; color: var(--dim); font-size: 0.7rem; padding: 12px; border-bottom: 2px solid #222; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #1a1a1e; text-align: center; }
        .col-forca { color: var(--gold); font-weight: 800; }

        @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } .full-chart { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="container">
    <header onclick="solicitarAcesso()">
        <h1>FIFA <span>DATABASE</span></h1>
        <p style="color:var(--dim); font-size: 0.8rem;">ANÁLISE TÁTICA: ATAQUE VS DEFESA</p>
    </header>

    <div id="adminPanel">
        <div id="editor"></div>
        <button onclick="addPlayer()" style="background:none; border:1px dashed #444; color:#666; width:100%; padding:10px; margin-top:10px; cursor:pointer;">+ JOGADOR</button>
        <button class="btn btn-green" onclick="salvar()" style="margin-top:15px; width:100%;">💾 ATUALIZAR DADOS</button>
    </div>

    <div class="charts-grid">
        <div class="chart-box full-chart">
            <canvas id="evolutionChart"></canvas>
        </div>
        <div class="chart-box">
            <canvas id="attackChart"></canvas>
        </div>
        <div class="chart-box">
            <canvas id="defenseChart"></canvas>
        </div>
    </div>

    <div class="table-wrap">
        <div style="text-align:center;">
            <select id="viewSelect" onchange="mudarView(this.value)" style="background:#1a1a1e; color:var(--neon); padding:10px; border-radius:8px; margin-bottom:15px; border:1px solid #333;"></select>
        </div>
        <table>
            <thead>
                <tr>
                    <th>POS</th>
                    <th style="text-align:left">JOGADOR</th>
                    <th>PTS</th>
                    <th style="color:var(--blue)">GF (ATA)</th>
                    <th style="color:var(--danger)">GS (DEF)</th>
                    <th>SG</th>
                    <th class="col-forca">FORÇA</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<script>
    const MINHA_SENHA = '123';
    let acessoAutorizado = false;
    const KEY = 'fifa_tactical_v42';
    let db = JSON.parse(localStorage.getItem(KEY)) || { atual: [], historico: [] };
    let modo = 'atual';
    let charts = { evolution: null, attack: null, defense: null };

    function solicitarAcesso() {
        const pass = prompt("Acesso:");
        if(pass === MINHA_SENHA) { acessoAutorizado = true; document.getElementById('adminPanel').style.display = 'block'; render(); }
    }

    function mudarView(v) { modo = v; render(); }
    const calcForca = (gp, gc) => (gp * 3.5) - (gc * 2.5);

    function render() {
        atualizarMenu();
        const tbody = document.getElementById("tbody");
        let lista = (modo === 'atual') ? [...db.atual] : (modo === 'geral' ? processarGeral() : [...db.historico[modo].dados]);

        lista.sort((a,b) => ((b.v*3)+b.e) - ((a.v*3)+a.e) || (b.gp-b.gc) - (a.gp-a.gc));

        tbody.innerHTML = lista.map((j, i) => `
            <tr>
                <td>${i+1}º</td>
                <td style="text-align:left"><b>${j.nome}</b></td>
                <td style="color:var(--neon)">${(j.v*3)+j.e}</td>
                <td style="color:var(--blue)">${j.gp}</td>
                <td style="color:var(--danger)">${j.gc}</td>
                <td>${j.gp-j.gc}</td>
                <td class="col-forca">${calcForca(j.gp, j.gc).toFixed(1)}</td>
            </tr>
        `).join('');

        if(acessoAutorizado) renderEditor();
        renderCharts(lista);
    }

    function renderCharts(lista) {
        const nomes = lista.map(j => j.nome);
        const gfs = lista.map(j => j.gp);
        const gss = lista.map(j => j.gc);

        // Configuração Comum
        const opt = (title) => ({
            responsive: true, maintainAspectRatio: false,
            plugins: { title: { display: true, text: title, color: '#fff' }, legend: { display: false } },
            scales: { y: { grid: { color: '#222' } }, x: { ticks: { color: '#888' } } }
        });

        // Gráfico de Ataque
        if (charts.attack) charts.attack.destroy();
        charts.attack = new Chart(document.getElementById('attackChart'), {
            type: 'bar',
            data: {
                labels: nomes,
                datasets: [{
                    label: 'Golos Marcados',
                    data: gfs,
                    backgroundColor: gfs.map(v => v === Math.max(...gfs) ? '#00ff87' : '#00d4ff88'),
                    borderRadius: 5
                }]
            },
            options: opt('MELHORES ATAQUES (GF)')
        });

        // Gráfico de Defesa
        if (charts.defense) charts.defense.destroy();
        charts.defense = new Chart(document.getElementById('defenseChart'), {
            type: 'bar',
            data: {
                labels: nomes,
                datasets: [{
                    label: 'Golos Sofridos',
                    data: gss,
                    backgroundColor: gss.map(v => v === Math.max(...gss) ? '#ff4444' : '#ff444433'),
                    borderRadius: 5
                }]
            },
            options: opt('PIORES DEFESAS (GS)')
        });

        // Evolução (simplificado nesta versão para foco tático)
        if (charts.evolution) charts.evolution.destroy();
        charts.evolution = new Chart(document.getElementById('evolutionChart'), {
            type: 'line',
            data: {
                labels: nomes,
                datasets: [{
                    label: 'Força Atual',
                    data: lista.map(j => calcForca(j.gp, j.gc)),
                    borderColor: '#ffd700',
                    borderWidth: 4,
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(255, 215, 0, 0.1)'
                }]
            },
            options: opt('EQUILÍBRIO DE FORÇA POR JOGADOR')
        });
    }

    // Funções de Gestão (Mesmas das anteriores)
    function atualizarMenu() {
        const select = document.getElementById("viewSelect");
        select.innerHTML = '<option value="atual">Temporada Atual</option><option value="geral">Ranking Geral</option>';
        db.historico.forEach((temp, i) => { select.innerHTML += `<option value="${i}">Época: ${temp.nome}</option>`; });
    }

    function renderEditor() {
        document.getElementById('editor').innerHTML = db.atual.map((j,i) => `
            <div style="display:flex; gap:5px; margin-bottom:5px;">
                <input style="flex:2" type="text" value="${j.nome}" onchange="db.atual[${i}].nome=this.value">
                <input style="flex:1" type="number" value="${j.gp}" onchange="db.atual[${i}].gp=parseInt(this.value)">
                <input style="flex:1" type="number" value="${j.gc}" onchange="db.atual[${i}].gc=parseInt(this.value)">
                <input style="flex:1" type="number" value="${j.v}" onchange="db.atual[${i}].v=parseInt(this.value)">
                <input style="flex:1" type="number" value="${j.e}" onchange="db.atual[${i}].e=parseInt(this.value)">
                <input style="flex:1" type="number" value="${j.d}" onchange="db.atual[${i}].d=parseInt(this.value)">
            </div>
        `).join('');
    }

    function processarGeral() {
        let res = {};
        db.historico.forEach(t => t.dados.forEach(j => {
            if(!res[j.nome]) res[j.nome] = {nome:j.nome, v:0, e:0, d:0, gp:0, gc:0};
            res[j.nome].v += j.v; res[j.nome].e += j.e; res[j.nome].d += j.d;
            res[j.nome].gp += j.gp; res[j.nome].gc += j.gc;
        }));
        db.atual.forEach(j => {
            if(!res[j.nome]) res[j.nome] = {nome:j.nome, v:0, e:0, d:0, gp:0, gc:0};
            res[j.nome].v += j.v; res[j.nome].e += j.e; res[j.nome].d += j.d;
            res[j.nome].gp += j.gp; res[j.nome].gc += j.gc;
        });
        return Object.values(res);
    }

    function salvar() { localStorage.setItem(KEY, JSON.stringify(db)); render(); }
    function addPlayer() { db.atual.push({nome:"Novo", v:0, e:0, d:0, gp:0, gc:0}); render(); }
    function encerrarTemporada() {
        let n = prompt("Nome da Época:");
        if(n) { db.historico.push({ nome: n, dados: JSON.parse(JSON.stringify(db.atual)) }); db.atual = db.atual.map(j => ({ ...j, v:0, e:0, d:0, gp:0, gc:0 })); salvar(); }
    }
    render();
</script>
</body>
</html>
